<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fishradar Phuket Live - Optimized Map View</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap");
    
    :root {
      --bg: #121814;
      --surface: rgba(28, 38, 30, 0.9);
      --surface-solid: #1c261e;
      --surface-2: #232f26;
      --text: #e8eee6;
      --text-muted: #8fa08b;
      --primary: #0fb67f;
      --primary-2: #0a8a6b;
      --accent: #ffc93c;
      --border: hsla(0, 0%, 100%, 0.1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    * {
      font-family: 'Outfit', 'Noto Sans Thai', system-ui, sans-serif;
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    /* แผนที่เต็มจอ */
    #map {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* สไตล์ UI Panel แบบลอยตัว */
    .floating-panel {
      position: absolute;
      z-index: 10;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    /* แผงควบคุมด้านบน (Top Bar / Search) */
    .top-bar {
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .top-bar input::placeholder {
      color: var(--text-muted);
    }

    /* ปุ่มเปิด-ปิดเมนูด้านข้าง */
    .menu-toggle-btn {
      position: absolute;
      top: 80px;
      left: 16px;
      z-index: 15;
      background: var(--surface-solid);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: background 0.2s;
    }

    .menu-toggle-btn:hover {
      background: var(--surface-2);
    }

    /* แผงควบคุมหลักด้านข้าง (Collapsible Drawer) */
    .side-drawer {
      top: 140px;
      left: 16px;
      width: 340px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      padding: 16px;
      transform: translateX(-110%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .side-drawer.open {
      transform: translateX(0);
    }

    /* แผงข้อมูลสรุปด้านล่าง (Bottom Sheet สำหรับมือถือหรือจอเล็ก) */
    .bottom-info-panel {
      bottom: 20px;
      left: 16px;
      right: 16px;
      max-width: 500px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-2);
    }

    /* Scrollbar ปรับแต่งให้สวยงาม */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .top-bar {
        left: 12px;
        right: 12px;
      }
      .side-drawer {
        width: calc(100vw - 32px);
      }
    }
  </style>
</head>
<body>

  <!-- พื้นที่แผนที่หลัก (Full View) -->
  <div id="map"></div>

  <!-- แถบค้นหาและควบคุมด้านบน -->
  <div class="floating-panel top-bar">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search-input" placeholder="ค้นหาพิกัด จุดตกปลา หรือโซน Smart Money...">
  </div>

  <!-- ปุ่มสลับเปิด-ปิดเมนู -->
  <button class="menu-toggle-btn" onclick="toggleDrawer()">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    <span>เมนู / วิเคราะห์</span>
  </button>

  <!-- แผงเมนูด้านข้าง (ซ่อน/แสดงได้) -->
  <div id="sideDrawer" class="floating-panel side-drawer">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700;">Smart Money & Radar</h3>
      <button onclick="toggleDrawer()" style="background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 18px;">✕</button>
    </div>
    <hr style="border-color: var(--border); margin-bottom: 12px;">
    <div style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">
      <p style="margin-bottom: 8px;">📊 <strong>ระบบวิเคราะห์กระแสเงินทุน:</strong> เน้นการตรวจสอบจุดกลับตัวและพฤติกรรมเจ้ามืออย่างแม่นยำ</p>
      <p style="margin-bottom: 8px;">🌊 <strong>สภาพแวดล้อม:</strong> อุณหภูมิน้ำ ทิศทางคลื่น และกระแสน้ำบริเวณภูเก็ต</p>
    </div>
  </div>

  <!-- แผงข้อมูลด่วนด้านล่าง -->
  <div class="floating-panel bottom-info-panel">
    <div>
      <div style="font-size: 11px; color: var(--text-muted);">สถานะระบบ</div>
      <div style="font-size: 13px; font-weight: 600; color: var(--primary);">● พร้อมใช้งาน (Live)</div>
    </div>
    <button class="btn-primary" onclick="alert('รีเฟรชข้อมูลเรดาร์เรียบร้อย')">อัปเดตข้อมูล</button>
  </div>

  <script>
    function toggleDrawer() {
      const drawer = document.getElementById('sideDrawer');
      drawer.classList.toggle('open');
    }
  </script>
</body>
</html>
