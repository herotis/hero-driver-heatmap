<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Hero Driver Map — Phuket Team</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#0b1220;--panel:#111c2f;--ink:#eaf1ff;--muted:#9aa9c2;--accent:#0284c7;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#map{height:100%;width:100%;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);overflow:hidden}
#map{position:absolute;inset:0;z-index:1}

/* Topbar */
.topbar{position:fixed;z-index:500;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:#0b1220ee;color:var(--ink);border:1px solid #ffffff1a;border-radius:16px;box-shadow:0 8px 30px #00000066;backdrop-filter:blur(12px)}
.brand{font-weight:900;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.status{font-size:11px;color:var(--muted);margin-top:2px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{white-space:nowrap;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;background:#1e293b;color:#dbeafe}
.pill.ok{background:#14532d;color:#86efac}
.pill.err{background:#7f1d1d;color:#fecdd3}

/* Controls Bar */
.controls{position:fixed;z-index:500;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.controls button{pointer-events:auto;border:1px solid #ffffff26;border-radius:14px;padding:12px 16px;background:#0b1220ee;color:#f8fafc;font-size:13px;font-weight:800;box-shadow:0 6px 20px #0006;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;gap:5px;transition:0.15s ease}
.controls button:active{transform:scale(0.96)}
.controls button.primary{background:#0284c7;border-color:#38bdf8;color:#fff}
.controls button.active-btn{background:#1e293b;border-color:#60a5fa}
.controls button:disabled{opacity:.5;pointer-events:none}

/* Speedometer HUD */
.speed-hud{position:fixed;z-index:500;top:calc(70px + env(safe-area-inset-top));right:12px;background:#0b1220ee;border:1px solid #ffffff1c;border-radius:14px;padding:8px 12px;text-align:center;color:white;box-shadow:0 4px 20px #0005;backdrop-filter:blur(8px);display:none}
.speed-val{font-size:22px;font-weight:900;color:#38bdf8;line-height:1}
.speed-unit{font-size:10px;color:var(--muted);font-weight:700}

/* Modal Join Form */
#joinPanel{position:fixed;inset:0;z-index:2000;background:#07101fee;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(10px)}
.card{width:min(100%,400px);background:#ffffff;color:#0f172a;border-radius:24px;padding:24px;box-shadow:0 24px 70px #000c}
.title{font-size:22px;font-weight:900;color:#0f172a}
.sub{font-size:13px;color:#64748b;line-height:1.5;margin:6px 0 16px}
.field-label{font-size:12px;font-weight:800;color:#334155;margin:12px 0 6px}
.input{width:100%;height:48px;border:1.5px solid #cbd5e1;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;outline:none;background:#f8fafc}
.input:focus{border-color:#0284c7;background:#fff;box-shadow:0 0 0 3px #38bdf833}
.colors{display:flex;gap:10px;margin:8px 0 18px}
.color-btn{height:44px;flex:1;border:3px solid transparent;border-radius:12px;cursor:pointer}
.color-btn.active{border-color:#0f172a;outline:2px solid #fff;outline-offset:-6px;transform:scale(1.05)}
.join{width:100%;min-height:50px;border:0;border-radius:14px;background:#0f172a;color:white;font-weight:900;font-size:15px;cursor:pointer;margin-top:6px}
.join:disabled{opacity:.6;cursor:wait}
.smallprint{font-size:11px;color:#64748b;margin-top:14px;line-height:1.5;word-break:break-word}

/* Driver Pin */
.driver-wrap{display:flex;flex-direction:column;align-items:center}
.driver-pin{width:36px;height:36px;border-radius:50%;border:3px solid white;box-shadow:0 3px 12px #0008;display:flex;align-items:center;justify-content:center;color:white;font-size:15px;font-weight:900}
.driver-label{margin-top:2px;background:#0b1220ee;color:white;border-radius:6px;padding:2px 6px;white-space:nowrap;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0004}

@media(min-width:700px){
  .topbar{left:18px;right:auto;min-width:320px}
  .controls{left:50%;right:auto;transform:translateX(-50%);bottom:20px}
}
</style>
</head>
<body>

<div id="map"></div>

<!-- มาตรวัดความเร็ว -->
<div class="speed-hud" id="speedHud">
  <div class="speed-val" id="speedVal">0</div>
  <div class="speed-unit">กม./ชม.</div>
</div>

<div class="topbar">
  <div>
    <div class="brand">📍 PHUKET TEAM</div>
    <div class="status" id="statusText">พร้อมใช้งาน</div>
  </div>
  <div class="pill" id="online">0 คน</div>
</div>

<div class="controls">
  <button id="locateBtn" class="primary">◎ พิกัดฉัน</button>
  <button id="followBtn">ล็อคจอ: เปิด</button>
  <button id="layerBtn">🗺️ ดาวเทียม</button>
  <button id="shareBtn">🔗 แชร์ทีม</button>
  <button id="leaveBtn" hidden>ออก</button>
</div>

<!-- หน้าต่างเข้าร่วมทีม -->
<div id="joinPanel">
  <section class="card">
    <div class="title">🚗 เข้าร่วมทีมคนขับ</div>
    <div class="sub">แชร์พิกัด GPS สดกับทีมภูเก็ต กรุณากดอนุญาต Location</div>
    
    <div class="field-label">ชื่อคนขับ (แสดงบนแผนที่)</div>
    <input class="input" id="nameInput" maxlength="20" placeholder="เช่น ช่างบอย / บังแอน" autocomplete="nickname">
    
    <div class="field-label">สีประจำตัวของคุณ</div>
    <div class="colors" id="colors"></div>
    
    <button class="join" id="joinBtn">เริ่มแชร์ตำแหน่งสด</button>
    <div class="smallprint" id="dbg"></div>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
(() => {
'use strict';
const TEAM_PATH = 'teams/phuket/drivers';
const COLORS = [
  {name:'แดง', bg:'#ef4444'},
  {name:'เขียว', bg:'#10b981'},
  {name:'ฟ้า', bg:'#0284c7'},
  {name:'ส้ม', bg:'#f59e0b'},
  {name:'ม่วง', bg:'#8b5cf6'}
];

const firebaseConfig = {
  apiKey: "AIzaSyCjBIqaHt_0HywLaFuSS7JZRwAZyhl9rQ",
  authDomain: "hero-team-map.firebaseapp.com",
  databaseURL: "https://hero-team-map-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hero-team-map",
  storageBucket: "hero-team-map.firebasestorage.app",
  messagingSenderId: "369947580532",
  appId: "1:369947580532:web:6ac9dc69a5460ed1d19921"
};

const $ = id => document.getElementById(id);
let selectedColor = COLORS[0];
let myId = null, myName = '', db = null, auth = null;
let gpsWatch = null, myMarker = null, myCircle = null, lastPosition = null;
let isFollowing = true, joined = false, remoteListener = null, connListener = null;
let heartbeatTimer = null, isPushing = false, lastPushTs = 0, lastRenderTs = 0;
let isSatellite = false, wakeLock = null;
const remoteMarkers = new Map();

// 1. ตั้งค่าแผนที่ Leaflet (รองรับสลับโหมดถนน และโหมดดาวเทียมความละเอียดสูง)
const map = L.map('map', {zoomControl: false}).setView([7.8804, 98.3923], 12);
const streetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, attribution: '&copy; CARTO'
}).addTo(map);

const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: '&copy; Esri'
});

L.control.zoom({position: 'topright'}).addTo(map);
map.on('dragstart', () => { if (isFollowing) { isFollowing = false; updateFollowButton(); } });

function setStatus(text, mode=''){
  $('statusText').textContent = text;
  const pill = $('online');
  pill.classList.toggle('ok', mode === 'ok');
  pill.classList.toggle('err', mode === 'err');
}

function escapeHtml(v){ return String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function validCoords(lat,lng){ return Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&!(lat===0&&lng===0); }

function makeDriverIcon(name, color){
  const char = escapeHtml((name || '').trim().charAt(0).toUpperCase() || '?');
  return L.divIcon({
    className: '',
    html: `<div class="driver-wrap"><div class="driver-pin" style="background:${color}">${char}</div><div class="driver-label">${escapeHtml(name||'ฉัน')}</div></div>`,
    iconSize: [80, 56],
    iconAnchor: [40, 18],
    popupAnchor: [0, -18]
  });
}

function makePopup(d){
  const acc = d.acc ? `±${d.acc} ม.` : '';
  const spd = d.spd ? `<br>ความเร็ว: <b>${d.spd}</b> กม./ชม.` : '';
  const ts = d.ts ? new Date(d.ts).toLocaleTimeString('th-TH') : '';
  return `<b>${escapeHtml(d.name || 'เพื่อนร่วมทาง')}</b><br>อัปเดต: ${ts} (${acc})${spd}`;
}

function updateFollowButton(){
  $('followBtn').textContent = isFollowing ? 'ล็อคจอ: เปิด' : 'ล็อคจอ: ปิด';
  $('followBtn').classList.toggle('active-btn', isFollowing);
}

// 2. ส่งพิกัดไปยัง Firebase
function pushLocation(){
  if(!joined || !db || !myId || !lastPosition) return;
  const now = Date.now();
  if(isPushing || (now - lastPushTs < 3000)) return;
  const {lat, lng, acc, spd} = lastPosition;
  if(!validCoords(lat, lng)) return;

  isPushing = true;
  lastPushTs = now;
  const data = {
    name: myName,
    color: selectedColor.bg,
    lat, lng,
    acc: Math.round(acc || 0),
    spd: spd || 0,
    ts: now
  };

  db.ref(`${TEAM_PATH}/${myId}`).update(data).finally(() => { isPushing = false; });
}

// 3. จัดการตำแหน่ง GPS ของตัวเอง
function renderMyPosition(pos){
  const now = Date.now();
  const acc = pos.coords.accuracy;
  if(acc && acc > 1500) return; // กรองสัญญาณที่คลาดเคลื่อนสูงเกินไปทิ้ง
  if(now - lastRenderTs < 1200) return;
  lastRenderTs = now;

  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  if(!validCoords(lat, lng)) return;

  // คำนวณความเร็ว (m/s -> km/h)
  const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
  $('speedVal').textContent = speedKmh;

  lastPosition = {lat, lng, acc, spd: speedKmh, ts: now};
  const point = [lat, lng];

  if(!myMarker){
    myMarker = L.marker(point, {icon: makeDriverIcon(myName || 'ฉัน', selectedColor.bg), zIndexOffset: 1000}).addTo(map);
    myCircle = L.circle(point, {radius: Math.max(5, acc || 15), color: selectedColor.bg, weight: 1, fillColor: selectedColor.bg, fillOpacity: 0.15}).addTo(map);
    map.setView(point, 16);
  } else {
    myMarker.setLatLng(point).setIcon(makeDriverIcon(myName || 'ฉัน', selectedColor.bg));
    myCircle.setLatLng(point).setRadius(Math.max(5, acc || 15));
    if(isFollowing) map.panTo(point, {animate: true, duration: 0.5});
  }

  myMarker.bindPopup(makePopup({name: myName || 'ฉัน', acc, spd: speedKmh, ts: now}));
  setStatus(`ออนไลน์ · พิกัดแม่นยำ ±${Math.round(acc)}ม.`, 'ok');

  if(joined){
    pushLocation();
    if(!heartbeatTimer) heartbeatTimer = setInterval(pushLocation, 5000);
  }
}

function onGpsError(err){
  const msg = {1: 'โปรดกดยอมรับ Location', 2: 'ไม่พบสัญญาณ GPS', 3: 'หมดเวลารอพิกัด'};
  setStatus(msg[err.code] || err.message, 'err');
}

// 4. วาดตำแหน่งเพื่อนร่วมทีม
function renderDrivers(snapshot){
  const data = snapshot.val() || {};
  let count = 0;
  const seen = new Set();
  const now = Date.now();

  Object.entries(data).forEach(([id, d]) => {
    if(!d || id === myId) return;
    const lat = Number(d.lat), lng = Number(d.lng), ts = Number(d.ts);
    if(!validCoords(lat, lng) || !Number.isFinite(ts)) return;

    const age = now - ts;
    if(age > 10 * 60 * 1000) return; // ไม่แสดงคนที่เงียบหายเกิน 10 นาที
    const isStale = age > 2 * 60 * 1000;
    
    seen.add(id);
    if(!isStale) count++;

    const color = d.color || '#ef4444';
    if(!remoteMarkers.has(id)){
      const marker = L.marker([lat, lng], {icon: makeDriverIcon(d.name, color)}).addTo(map);
      marker.setOpacity(isStale ? 0.4 : 1);
      marker.bindPopup(makePopup(d));
      remoteMarkers.set(id, marker);
    } else {
      const marker = remoteMarkers.get(id);
      marker.setLatLng([lat, lng]).setIcon(makeDriverIcon(d.name, color));
      marker.setOpacity(isStale ? 0.4 : 1);
      marker.setPopupContent(makePopup(d));
    }
  });

  // ลบหมุดคนที่ออกจากทีม
  for(const [id, marker] of remoteMarkers.entries()){
    if(!seen.has(id)){ map.removeLayer(marker); remoteMarkers.delete(id); }
  }
  $('online').textContent = `${count + (lastPosition ? 1 : 0)} คน`;
}

// 5. ระบบ WakeLock ป้องกันหน้าจอดับ
async function requestWakeLock(){
  try {
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e){}
}

// 6. กดเข้าร่วมทีม
async function joinTeam(){
  if(joined) return;
  myName = $('nameInput').value.trim();
  if(!myName){
    $('nameInput').focus();
    $('nameInput').style.borderColor = '#ef4444';
    return;
  }

  // เซฟข้อมูลลง LocalStorage
  localStorage.setItem('driver_name', myName);
  localStorage.setItem('driver_color', selectedColor.bg);

  if(!window.isSecureContext && location.hostname !== 'localhost'){
    setStatus('ต้องเปิดผ่าน HTTPS เท่านั้น', 'err');
    return;
  }

  $('joinBtn').disabled = true;
  $('joinBtn').textContent = 'กำลังเชื่อมต่อ...';

  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();

    if(!auth.currentUser) await auth.signInAnonymously();
    myId = 'driver_' + auth.currentUser.uid;

    // ระบบตัดชื่อออกอัตโนมัติเมื่อปิดแท็บหรือหลุด
    await db.ref(`${TEAM_PATH}/${myId}`).onDisconnect().remove();

    connListener = db.ref('.info/connected');
    connListener.on('value', snap => {
      if(snap.val() === false) setStatus('ขาดการเชื่อมต่อเน็ต...', 'err');
      else if(joined) setStatus('เชื่อมต่อสมบูรณ์', 'ok');
    });

    joined = true;
    $('joinPanel').style.display = 'none';
    $('leaveBtn').hidden = false;
    $('speedHud').style.display = 'block';

    remoteListener = db.ref(TEAM_PATH);
    remoteListener.on('value', renderDrivers);

    // เปิด GPS ติดตามต่อเนื่อง
    gpsWatch = navigator.geolocation.watchPosition(renderMyPosition, onGpsError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    });
    navigator.geolocation.getCurrentPosition(renderMyPosition, onGpsError, {
      enableHighAccuracy: true,
      timeout: 10000
    });

    requestWakeLock();
  } catch(err){
    console.error(err);
    setStatus('เชื่อมต่อล้มเหลว: ' + (err.message || ''), 'err');
    $('dbg').innerHTML = `<b>เกิดข้อผิดพลาด:</b> ${err.message}<br><small>ตรวจสอบ Authorized Domains ใน Firebase Console</small>`;
    $('joinBtn').disabled = false;
    $('joinBtn').textContent = 'ลองใหม่อีกครั้ง';
    joined = false;
  }
}

// 7. ออกจากทีม
async function leaveTeam(){
  if(gpsWatch !== null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if(connListener){ connListener.off(); }
  if(remoteListener){ remoteListener.off('value', renderDrivers); }
  if(db && myId){ try{ await db.ref(`${TEAM_PATH}/${myId}`).remove(); }catch(e){} }

  if(myMarker){ map.removeLayer(myMarker); myMarker = null; }
  if(myCircle){ map.removeLayer(myCircle); myCircle = null; }
  for(const m of remoteMarkers.values()) map.removeLayer(m);
  remoteMarkers.clear();

  joined = false;
  myId = null;
  lastPosition = null;
  $('online').textContent = '0 คน';
  $('speedHud').style.display = 'none';
  $('joinPanel').style.display = 'flex';
  $('leaveBtn').hidden = true;
  $('joinBtn').disabled = false;
  $('joinBtn').textContent = 'เริ่มแชร์ตำแหน่งสด';
  setStatus('ออกจากทีมแล้ว');
}

// โหลดข้อมูลเก่าจาก LocalStorage
const savedName = localStorage.getItem('driver_name');
const savedColor = localStorage.getItem('driver_color');
if(savedName) $('nameInput').value = savedName;

// สร้างปุ่มเลือกสี
COLORS.forEach((c, idx) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'color-btn' + ((savedColor === c.bg || (!savedColor && idx === 0)) ? ' active' : '');
  btn.style.background = c.bg;
  if(btn.classList.contains('active')) selectedColor = c;

  btn.onclick = () => {
    selectedColor = c;
    document.querySelectorAll('.color-btn').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    if(myMarker) myMarker.setIcon(makeDriverIcon(myName || 'ฉัน', selectedColor.bg));
  };
  $('colors').appendChild(btn);
});

// Event Listeners
$('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter') joinTeam(); });
$('joinBtn').addEventListener('click', joinTeam);
$('leaveBtn').addEventListener('click', leaveTeam);

$('followBtn').addEventListener('click', () => {
  isFollowing = !isFollowing;
  updateFollowButton();
  if(isFollowing && lastPosition){
    map.flyTo([lastPosition.lat, lastPosition.lng], 16, {animate: true});
    requestWakeLock();
  }
});

$('locateBtn').addEventListener('click', () => {
  isFollowing = true;
  updateFollowButton();
  if(lastPosition){
    map.flyTo([lastPosition.lat, lastPosition.lng], 17, {animate: true});
  } else {
    navigator.geolocation.getCurrentPosition(renderMyPosition, onGpsError, {enableHighAccuracy: true});
  }
  requestWakeLock();
});

// สลับเลเยอร์แผนที่ (ถนน / ดาวเทียม)
$('layerBtn').addEventListener('click', () => {
  isSatellite = !isSatellite;
  if(isSatellite){
    map.removeLayer(streetLayer);
    satLayer.addTo(map);
    $('layerBtn').textContent = '🗺️ แผนที่ปกติ';
  } else {
    map.removeLayer(satLayer);
    streetLayer.addTo(map);
    $('layerBtn').textContent = '🗺️ ดาวเทียม';
  }
});

// ปุ่มก็อปลิงก์แชร์ทีม
$('shareBtn').addEventListener('click', async () => {
  const url = window.location.href;
  if(navigator.share){
    try { await navigator.share({title: 'Hero Driver Map', url}); } catch(e){}
  } else {
    await navigator.clipboard.writeText(url);
    alert('คัดลอกลิงก์เรียบร้อย! ส่งให้เพื่อนร่วมทีมได้เลย');
  }
});

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && joined) requestWakeLock();
});

updateFollowButton();
})();
</script>
</body>
</html>
